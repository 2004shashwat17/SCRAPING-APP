version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"   # Backend API
      - "6080:6080"   # noVNC web interface
      - "5900:5900"   # VNC port
    environment:
      - PORT=8080
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_ENCRYPTION_KEY=${COOKIE_ENCRYPTION_KEY}
      - SAVE_PLAINTEXT_COOKIES=${SAVE_PLAINTEXT_COOKIES:-true}
      - NODE_ENV=${NODE_ENV:-production}
      - REDIS_URL=redis://redis:6379
      # Cloudflare R2 configuration
      - USE_CLOUD_STORAGE=${USE_CLOUD_STORAGE:-false}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET:-osint-cookies}
      # Optional: override cookie storage location
      # - COOKIE_DIR=/app/backend/cookies
    volumes:
      # Persist cookies across container restarts
      - ./backend/cookies:/app/backend/cookies
      # Persist scraper output
      - ./scraper_output:/app/scraper_output
      # Persist data (geocode cache, etc)
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    depends_on:
      - redis
    # Uncomment if you need to run as specific user
    # user: "${UID:-1000}:${GID:-1000}"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Optional: MongoDB service (if not using cloud MongoDB)
  # mongodb:
  #   image: mongo:7
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb_data:/data/db
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
  #     - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-changeme}
  #   restart: unless-stopped

volumes:
  redis_data:
